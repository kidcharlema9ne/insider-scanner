name: Bankruptcy and delisting check from SEC filing indexes (C35; development years only, D-068)
on:
  workflow_dispatch:
    inputs:
      year_run_id:
        description: 'refined-study run holding the year-* artifacts'
        required: false
        default: '42488283630'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - run: python research/canonical/delisting_check.py --selftest
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONPATH: .
        run: python -u research/canonical/delisting_check.py run reports/years --out reports/delist_cache.json
      - uses: actions/upload-artifact@v4
        with:
          name: delist-cache
          path: reports/delist_cache.json
