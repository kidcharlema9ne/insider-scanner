name: Free-year candidate integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'validate_free_year_universe.py'
      - 'research_html_report.py'
      - '.github/workflows/free-year-universe.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow exchange-calendars
      - name: Join audited SEC candidates to free-year prices and render coverage
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u validate_free_year_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: free-year-candidate-integration
          path: reports/free_year_*
          if-no-files-found: error
