name: Factor C4/C6 - purchase size, dollars and percent of holdings (development years and 2026 pilot only, D-068)
on:
  workflow_dispatch:
    inputs:
      year_run_id:
        description: 'refined-study run holding the year-* artifacts'
        required: false
        default: '42488283630'
      returns_run_id:
        description: 'refined-baseline run holding the returns-* artifacts'
        required: false
        default: '42490748366'
permissions:
  contents: read
  actions: read
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - run: python research/canonical/refined_study.py --selftest
      - run: python research/canonical/factor_size.py --selftest
      - name: Rebuild base and refined events (now carrying each purchase line)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/refined_study.py events --out reports/events_refined.json
      - uses: actions/upload-artifact@v4
        with:
          name: events_size
          path: reports/events_refined.json
  summary:
    needs: events
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - uses: actions/download-artifact@v4
        with:
          name: events_size
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/ret
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/factor_size.py reports/events_refined.json reports/years reports/ret
