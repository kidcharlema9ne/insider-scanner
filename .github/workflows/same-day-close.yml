name: Same-day-close entry test (filing accepted before 16:00 ET enters at that day's close; development years and 2026 pilot only, D-068; POST HOC)
on:
  workflow_dispatch:
    inputs:
      primary_run_id:
        description: 'Run of refined-baseline.yml whose primary_allowed artifact holds the primary set (Entry 28)'
        required: false
        default: '42490748366'
permissions:
  contents: read
  actions: read
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - run: python research/canonical/same_day_close.py --selftest
      - name: Rebuild refined events, read acceptance times of the trigger-date filings (allowed entries only)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/same_day_close.py events --out reports/timed_events.json
      - uses: actions/upload-artifact@v4
        with:
          name: timed_events
          path: reports/timed_events.json
  returns:
    needs: events
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed
          path: reports
          run-id: ${{ inputs.primary_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: timed_events
          path: reports
      - name: Returns, ${{ matrix.year }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/same_day_close.py year ${{ matrix.year }} --primary reports/primary_allowed.json --timed reports/timed_events.json --out reports/same_day_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: same-day-${{ matrix.year }}
          path: reports/same_day_${{ matrix.year }}.json
  summary:
    needs: returns
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: same-day-*
          merge-multiple: true
          path: reports
      - run: python -u research/canonical/same_day_close.py summary reports
