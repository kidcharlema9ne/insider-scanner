name: SEC bulk importer tests
on:
  push:
    paths:
      - 'sec_bulk_importer.py'
      - 'test_sec_bulk_importer.py'
      - '.github/workflows/sec-bulk-importer-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v test_sec_bulk_importer.py
