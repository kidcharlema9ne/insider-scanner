name: Free-year research smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'validate_free_year_report.py'
      - '.github/workflows/free-year-research-test.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow exchange-calendars
      - name: Verify SEC filing and R2 prices and render real-data report
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u validate_free_year_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-research-smoke
          path: reports/free_year_smoke.*
          if-no-files-found: error
