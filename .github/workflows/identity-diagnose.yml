name: Identity check diagnostic (prints past purchase prices beside archive closes; no returns)
on:
  workflow_dispatch:
    inputs:
      events_run_id:
        description: 'Run id of an identity-check run holding the events_priced artifact'
        required: true
        default: '42479461689'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2008,2010,2012,2014,2016,2018,2019,2021,2023,2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        with:
          name: events_priced
          path: reports
          run-id: ${{ inputs.events_run_id }}
          github-token: ${{ github.token }}
      - env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/identity_check.py diagnose ${{ matrix.year }} --events reports/events_priced.json
