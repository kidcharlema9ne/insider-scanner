name: Archive coverage audit and D-061 floor check (counts only, no returns)
on:
  workflow_dispatch:
    inputs:
      events_run_id:
        description: 'Reuse the events artifact from this earlier run id (skips the slow SEC database step)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  events:
    if: ${{ inputs.events_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - run: python research/canonical/archive_coverage_audit.py --selftest
      - name: Build four-plus-buyer events from the verified SEC candidate database
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/archive_coverage_audit.py events --out reports/events.json
      - uses: actions/upload-artifact@v4
        with:
          name: events
          path: reports/events.json
  audit:
    needs: events
    if: ${{ !cancelled() && (needs.events.result == 'success' || needs.events.result == 'skipped') }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        if: ${{ inputs.events_run_id == '' }}
        with:
          name: events
          path: reports
      - uses: actions/download-artifact@v4
        if: ${{ inputs.events_run_id != '' }}
        with:
          name: events
          path: reports
          run-id: ${{ inputs.events_run_id }}
          github-token: ${{ github.token }}
      - name: Audit ${{ matrix.year }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/archive_coverage_audit.py year ${{ matrix.year }} --events reports/events.json --out reports/year_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: year-${{ matrix.year }}
          path: reports/year_${{ matrix.year }}.json
  summary:
    needs: audit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports
      - run: python -u research/canonical/archive_coverage_audit.py summary reports
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-floor-check
          path: reports/year_*.json
