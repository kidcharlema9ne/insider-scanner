name: Excursions and stops (C29, absolute MAE and MFE at 1 and 2 months, 20-day trailing stop, 4 ATR trailing stop, deep-fall F; development years only, D-068)
on:
  workflow_dispatch:
    inputs:
      roles_run_id:
        description: 'factor-roles run holding the events_roles artifact (Entry 32)'
        required: false
        default: '42493259014'
      year_run_id:
        description: 'refined-study run holding the year-* artifacts'
        required: false
        default: '42488283630'
      decline_run_id:
        description: 'factor-decline run holding the decline-* artifacts (Entry 36)'
        required: false
        default: '42499472150'
      regime_run_id:
        description: 'factor-regime run holding the regime-* artifacts (Entry 37)'
        required: false
        default: '42501167019'
      returns_run_id:
        description: 'refined-baseline run holding primary_allowed and the returns-* artifacts (Entry 28)'
        required: false
        default: '42490748366'
      dv_run_id:
        description: 'dollar-volume-profile run holding the dv-* artifacts (Entry 54)'
        required: false
        default: '42518394556'
permissions:
  contents: read
  actions: read
jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - run: python research/canonical/excursion_stops.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed
          path: reports
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - name: Paths and stops, ${{ matrix.year }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/excursion_stops.py year ${{ matrix.year }} --primary reports/primary_allowed.json --out reports/exc_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: exc-${{ matrix.year }}
          path: reports/exc_${{ matrix.year }}.json
  summary:
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - uses: actions/download-artifact@v4
        with:
          name: events_roles
          path: reports
          run-id: ${{ inputs.roles_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: decline-*
          merge-multiple: true
          path: reports/decl
          run-id: ${{ inputs.decline_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: regime-*
          merge-multiple: true
          path: reports/feat
          run-id: ${{ inputs.regime_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/ret
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dv-*
          merge-multiple: true
          path: reports/dv
          run-id: ${{ inputs.dv_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: exc-*
          merge-multiple: true
          path: reports/exc
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/excursion_stops.py scan reports/events_refined.json reports/years reports/decl reports/feat reports/ret reports/exc reports/dv
