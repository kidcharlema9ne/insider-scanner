name: Earnings-date coverage test from SEC filing indexes (C34; development years only, D-068)
on:
  workflow_dispatch:
    inputs:
      roles_run_id:
        description: 'factor-roles run holding the events_roles artifact (Entry 32)'
        required: false
        default: '42493259014'
      year_run_id:
        description: 'refined-study run holding the year-* artifacts'
        required: false
        default: '42488283630'
      decline_run_id:
        description: 'factor-decline run holding the decline-* artifacts (Entry 36)'
        required: false
        default: '42499472150'
      regime_run_id:
        description: 'factor-regime run holding the regime-* artifacts (Entry 37)'
        required: false
        default: '42501167019'
      returns_run_id:
        description: 'refined-baseline run holding primary_allowed and the returns-* artifacts (Entry 28)'
        required: false
        default: '42490748366'
      dv_run_id:
        description: 'dollar-volume-profile run holding the dv-* artifacts (Entry 54)'
        required: false
        default: '42518394556'
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - uses: actions/download-artifact@v4
        with:
          name: events_roles
          path: reports
          run-id: ${{ inputs.roles_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: decline-*
          merge-multiple: true
          path: reports/decl
          run-id: ${{ inputs.decline_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: regime-*
          merge-multiple: true
          path: reports/feat
          run-id: ${{ inputs.regime_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/ret
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed
          path: reports
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONPATH: .
        run: python -u research/canonical/earnings_dates.py fetch --primary reports/primary_allowed.json --out reports/earn_cache.json
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/earnings_dates.py scan reports/earn_cache.json reports/events_refined.json reports/years reports/decl reports/feat reports/ret
      - uses: actions/upload-artifact@v4
        with:
          name: earn-cache
          path: reports/earn_cache.json
