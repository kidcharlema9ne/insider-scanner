name: Factor C8/C9/C1 - decline look-backs and SPY regime at entry (development years and 2026 pilot only, D-068)
on:
  workflow_dispatch:
    inputs:
      features_run_id:
        description: 'optional: earlier factor-decline run whose decline-* artifacts to reuse (feature code unchanged); empty = recompute'
        required: false
        default: ''
      returns_run_id:
        description: 'refined-baseline run holding primary_allowed and the returns-* artifacts (Entry 28)'
        required: false
        default: '42490748366'
permissions:
  contents: read
  actions: read
jobs:
  features:
    if: ${{ inputs.features_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - run: python research/canonical/factor_decline.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed
          path: reports
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - name: Look-back features, ${{ matrix.year }} (sessions strictly before entry; no returns computed)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/factor_decline.py year ${{ matrix.year }} --primary reports/primary_allowed.json --out reports/decline_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: decline-${{ matrix.year }}
          path: reports/decline_${{ matrix.year }}.json
  summary:
    needs: features
    if: ${{ !cancelled() && (needs.features.result == 'success' || needs.features.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - if: ${{ inputs.features_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: decline-*
          merge-multiple: true
          path: reports/feat
      - if: ${{ inputs.features_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: decline-*
          merge-multiple: true
          path: reports/feat
          run-id: ${{ inputs.features_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/ret
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/factor_decline.py summary reports/feat reports/ret
