name: Year-by-year consistency of the deep-fall rule (C33, descriptive, re-reads Entry 70-71 paths; development years only, D-068)
on:
  workflow_dispatch:
    inputs:
      roles_run_id:
        description: 'factor-roles run holding the events_roles artifact (Entry 32)'
        required: false
        default: '42493259014'
      year_run_id:
        description: 'refined-study run holding the year-* artifacts'
        required: false
        default: '42488283630'
      decline_run_id:
        description: 'factor-decline run holding the decline-* artifacts (Entry 36)'
        required: false
        default: '42499472150'
      regime_run_id:
        description: 'factor-regime run holding the regime-* artifacts (Entry 37)'
        required: false
        default: '42501167019'
      returns_run_id:
        description: 'refined-baseline run holding primary_allowed and the returns-* artifacts (Entry 28)'
        required: false
        default: '42490748366'
      cost_run_id:
        description: 'cost-stops-f run holding the cost-* artifacts (Entry 71)'
        required: false
        default: '42601132693'
      dv_run_id:
        description: 'dollar-volume-profile run holding the dv-* artifacts (Entry 54)'
        required: false
        default: '42518394556'
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - uses: actions/download-artifact@v4
        with:
          name: events_roles
          path: reports
          run-id: ${{ inputs.roles_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: decline-*
          merge-multiple: true
          path: reports/decl
          run-id: ${{ inputs.decline_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: regime-*
          merge-multiple: true
          path: reports/feat
          run-id: ${{ inputs.regime_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/ret
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dv-*
          merge-multiple: true
          path: reports/dv
          run-id: ${{ inputs.dv_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cost-*
          merge-multiple: true
          path: reports/cost
          run-id: ${{ inputs.cost_run_id }}
          github-token: ${{ github.token }}
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/year_by_year.py scan reports/events_refined.json reports/years reports/decl reports/feat reports/ret reports/cost reports/dv
