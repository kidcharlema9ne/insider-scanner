name: Cluster window variant (C38/C39, four-buyer window of W sessions instead of 15, plus the four conditions on that set; development years only, D-068; exploratory)
on:
  workflow_dispatch:
    inputs:
      window:
        description: 'Sessions of purchase dates before entry that count toward the four buyers (rule in force is 15)'
        required: true
        default: '21'
      old_returns_run_id:
        description: 'refined-baseline run holding the 15-session returns-* artifacts (Entry 28)'
        required: false
        default: '42490748366'
permissions:
  contents: read
  actions: read
env:
  CLUSTER_WINDOW: ${{ inputs.window }}
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - name: Self-tests at the rule-in-force window
        env:
          CLUSTER_WINDOW: '15'
          PYTHONPATH: .
        run: |
          python research/canonical/refined_study.py --selftest
          python research/canonical/cluster_counts_by_year.py --selftest
          python research/canonical/refined_baseline.py --selftest
          python research/canonical/window_overlap.py --selftest
      - name: Build base and refined event sets at window ${{ inputs.window }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/refined_study.py events --out reports/events_refined.json
      - uses: actions/upload-artifact@v4
        with:
          name: events_w${{ inputs.window }}
          path: reports/events_refined.json
  audit:
    needs: events
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        with:
          name: events_w${{ inputs.window }}
          path: reports
      - name: Identity v2 and floor, ${{ matrix.year }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/refined_study.py year ${{ matrix.year }} --events reports/events_refined.json --out reports/year_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: year-w${{ inputs.window }}-${{ matrix.year }}
          path: reports/year_${{ matrix.year }}.json
  primary:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        with:
          pattern: year-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/years
      - name: Rebuild primary set (development years only), keep allowed entries
        env:
          PYTHONPATH: .
        run: python -u research/canonical/refined_baseline.py primary reports/years --out reports/primary_allowed.json
      - uses: actions/upload-artifact@v4
        with:
          name: primary_allowed_w${{ inputs.window }}
          path: reports/primary_allowed.json
  returns:
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed_w${{ inputs.window }}
          path: reports
      - name: Returns, ${{ matrix.year }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/refined_baseline.py year ${{ matrix.year }} --primary reports/primary_allowed.json --out reports/returns_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: returns-w${{ inputs.window }}-${{ matrix.year }}
          path: reports/returns_${{ matrix.year }}.json
  summary:
    needs: returns
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/new
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/old
          run-id: ${{ inputs.old_returns_run_id }}
          github-token: ${{ github.token }}
      - name: Standard returns summary of the variant set
        env:
          PYTHONPATH: .
        run: python -u research/canonical/refined_baseline.py summary reports/new
      - name: Compare with the 15-session set
        env:
          PYTHONPATH: .
        run: python -u research/canonical/window_overlap.py reports/new reports/old
  decline:
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - env:
          CLUSTER_WINDOW: '15'
          PYTHONPATH: .
        run: python research/canonical/factor_decline.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed_w${{ inputs.window }}
          path: reports
      - name: Features, ${{ matrix.year }} (sessions strictly before entry; no returns computed)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/factor_decline.py year ${{ matrix.year }} --primary reports/primary_allowed.json --out reports/decline_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: decline-w${{ inputs.window }}-${{ matrix.year }}
          path: reports/decline_${{ matrix.year }}.json
  regime:
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - env:
          CLUSTER_WINDOW: '15'
          PYTHONPATH: .
        run: python research/canonical/factor_regime.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed_w${{ inputs.window }}
          path: reports
      - name: Features, ${{ matrix.year }} (sessions strictly before entry; no returns computed)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/factor_regime.py year ${{ matrix.year }} --primary reports/primary_allowed.json --out reports/regime_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: regime-w${{ inputs.window }}-${{ matrix.year }}
          path: reports/regime_${{ matrix.year }}.json
  dd:
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - env:
          CLUSTER_WINDOW: '15'
          PYTHONPATH: .
        run: python research/canonical/drawdown_scan.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: primary_allowed_w${{ inputs.window }}
          path: reports
      - name: Features, ${{ matrix.year }} (sessions strictly before entry; no returns computed)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/drawdown_scan.py ddyear ${{ matrix.year }} --primary reports/primary_allowed.json --out reports/dd_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: dd-w${{ inputs.window }}-${{ matrix.year }}
          path: reports/dd_${{ matrix.year }}.json
  conditions:
    needs: [returns, decline, regime, dd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - uses: actions/download-artifact@v4
        with:
          name: events_w${{ inputs.window }}
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: year-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/years
      - uses: actions/download-artifact@v4
        with:
          pattern: decline-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/decl
      - uses: actions/download-artifact@v4
        with:
          pattern: regime-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/feat
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/ret
      - uses: actions/download-artifact@v4
        with:
          pattern: dd-w${{ inputs.window }}-*
          merge-multiple: true
          path: reports/dd
      - name: The four conditions on this window's set (flag combination counts, trades per month, excess)
        env:
          PYTHONPATH: .
        run: python -u research/canonical/flag_combo_counts.py reports/events_refined.json reports/years reports/decl reports/feat reports/ret reports/dd
