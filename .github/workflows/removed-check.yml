name: Removed-events check - do D-064 removals behave differently? (development years and 2026 pilot only, D-068)
on:
  workflow_dispatch:
    inputs:
      year_run_id:
        description: 'Run of refined-study.yml whose year-* artifacts hold identity and floor results'
        required: false
        default: '42488283630'
permissions:
  contents: read
  actions: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - run: python research/canonical/removed_events_check.py --selftest
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/removed_events_check.py select reports/years --out reports/groups.json
      - uses: actions/upload-artifact@v4
        with:
          name: groups
          path: reports/*.json
  returns:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars
      - uses: actions/download-artifact@v4
        with:
          name: groups
          path: reports
      - env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/refined_baseline.py year ${{ matrix.year }} --primary reports/events_to_price.json --out reports/returns_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rmreturns-${{ matrix.year }}
          path: reports/returns_${{ matrix.year }}.json
  summary:
    needs: returns
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rmreturns-*
          merge-multiple: true
          path: reports/ret
      - uses: actions/download-artifact@v4
        with:
          name: groups
          path: reports
      - run: python -u research/canonical/removed_events_check.py summary reports/ret reports/groups.json
