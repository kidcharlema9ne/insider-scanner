name: Survivorship hazard for the deep-fall lead (C26a, incomplete-window hazard, imputation, break-even hazard, dose-response; D-068 guard)
on:
  workflow_dispatch:
    inputs:
      year_run_id:
        description: 'refined-study run holding events_refined and year-* artifacts'
        required: false
        default: '42488283630'
      returns_run_id:
        description: 'refined-baseline run holding returns-* artifacts (Entry 28)'
        required: false
        default: '42490748366'
      features_run_id:
        description: 'factor-decline run holding decline-* artifacts (Entry 36)'
        required: false
        default: '42499472150'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - run: python research/canonical/survivorship_hazard.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: events_refined
          path: reports/events
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: year-*
          merge-multiple: true
          path: reports/years
          run-id: ${{ inputs.year_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: decline-*
          merge-multiple: true
          path: reports/feat
          run-id: ${{ inputs.features_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: returns-*
          merge-multiple: true
          path: reports/ret
          run-id: ${{ inputs.returns_run_id }}
          github-token: ${{ github.token }}
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/survivorship_hazard.py reports/events/events_refined.json reports/years reports/feat reports/ret
