name: Hold horizons mid - 21, 42 and 63 session holds on the cohort and three subsets (development years only, D-068; Entry 47)
on:
  workflow_dispatch:
    inputs:
      run42:
        description: 'refined-baseline-hold run, hold 42'
        required: true
      run63:
        description: 'refined-baseline-hold run, hold 63'
        required: true
      decline_run_id:
        required: false
        default: '42499472150'
      regime_run_id:
        required: false
        default: '42501167019'
      returns21_run_id:
        description: 'refined-baseline run holding the 21-session returns (Entry 28)'
        required: false
        default: '42490748366'
permissions:
  contents: read
  actions: read
jobs:
  mid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas_market_calendars numpy
      - run: python research/canonical/hold_horizons.py --selftest
      - uses: actions/download-artifact@v4
        with: {pattern: 'decline-*', merge-multiple: true, path: reports/decl, run-id: '${{ inputs.decline_run_id }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'regime-*', merge-multiple: true, path: reports/feat, run-id: '${{ inputs.regime_run_id }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'returns-*', merge-multiple: true, path: reports/r21, run-id: '${{ inputs.returns21_run_id }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'returns-*', merge-multiple: true, path: reports/r42, run-id: '${{ inputs.run42 }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'returns-*', merge-multiple: true, path: reports/r63, run-id: '${{ inputs.run63 }}', github-token: '${{ github.token }}'}
      - env:
          PYTHONPATH: .
        run: python -u research/canonical/hold_horizons.py mid reports/decl reports/feat reports/r21 reports/r42 reports/r63
