name: Insider scanner

# Cron times are UTC. EDGAR accepts Form 4s 6 AM-10 PM Eastern on weekdays, so we scan every
# 30 minutes across that window: 11:07-23:37 UTC (6:07 AM-6:37 PM winter) plus 00:07-02:37 UTC
# (7:07-9:37 PM winter). In summer (EDT) the same times are one hour later. ~32 scans a day.
# Odd minutes on purpose: GitHub delays jobs queued at :00 by 5-30 minutes.
on:
  schedule:
    - cron: "7,37 11-23 * * 1-5"   # weekday daytime scans
    - cron: "7,37 0-2 * * 2-6"     # weekday evening scans (UTC date has already rolled over)
    - cron: "20 3 * * 2-6"         # nightly report email (10:20 PM winter, after EDGAR closes)
    - cron: "23 13 * * 6"          # Saturday: 7-day report email + scorecard + heartbeat commit
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [scan, track, digest, digest-week, backfill, notify-test]
        default: scan

concurrency:
  group: insider-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'M D mgd.dorsey@gmail.com' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'mgd.dorsey@gmail.com' }}
      SIGNALS_LOG: data/signals.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest test_insider_scanner test_new_features

      - name: Restore database cache
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: .state/insider.db
          key: insider-db-${{ github.run_id }}
          restore-keys: insider-db-

      - name: Decide what to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 13 * * 6" ]; then
            echo "cmd=digest-week" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 3 * * 2-6" ]; then
            echo "cmd=digest" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=scan" >> "$GITHUB_OUTPUT"
          fi

      - name: Build history if the database is missing
        if: steps.mode.outputs.cmd != 'notify-test'
        run: |
          mkdir -p .state
          if [ ! -f .state/insider.db ] || [ "${{ steps.mode.outputs.cmd }}" = "backfill" ]; then
            python -u insider_scanner.py --home .state backfill --quarters 14
          fi

      - name: Run
        if: steps.mode.outputs.cmd != 'backfill'
        run: |
          mkdir -p .state
          CMD="${{ steps.mode.outputs.cmd }}"
          if [ "$CMD" = "digest-week" ]; then CMD="digest --days 7 --print"; fi
          if [ "$CMD" = "digest" ]; then CMD="digest --days 1 --print"; fi
          python -u insider_scanner.py --home .state $CMD 2>&1 | tee run.log
          { echo '### ${{ steps.mode.outputs.cmd }}'; echo '```'; tail -n 60 run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save database cache
        if: always() && hashFiles('.state/insider.db') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/insider.db
          key: insider-db-${{ github.run_id }}

      - name: Commit signal log (also keeps the repo active)
        if: always()
        run: |
          if [ "${{ steps.mode.outputs.cmd }}" = "digest-week" ] || [ "${{ steps.mode.outputs.cmd }}" = "track" ]; then date -u +"%Y-%m-%dT%H:%MZ" > data/heartbeat.txt; fi
          git config user.name "insider-scanner-bot"
          git config user.email "insider-scanner-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: update signal log [skip ci]" && git push)
