name: Four-buyer cluster counts by year (filings only)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas_market_calendars
      - run: python research/canonical/cluster_counts_by_year.py --selftest
      - name: Count clusters from the verified SEC candidate database
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/cluster_counts_by_year.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-counts-by-year
          path: reports/cluster_counts_by_year.json
          if-no-files-found: warn
